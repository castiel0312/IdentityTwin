# Local/demo deployment only. The development credentials in this stack are
# not production secrets; production requires managed credentials and OIDC.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: identitytwin_user
      POSTGRES_PASSWORD: identitytwin_pass
      POSTGRES_DB: identitytwin
    # The database is reachable only on the private Docker network (db:5432).
    # Host port publishing is intentionally omitted: identitytwin_private is an
    # internal network, so a host mapping would not be published anyway. The API
    # and alembic/seed all connect via the Docker service hostname (db:5432),
    # which is the secure, intended path. Host access to PostgreSQL is not
    # required for the stack to operate.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-honey-role.sql:/docker-entrypoint-initdb.d/01-honey-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identitytwin_user -d identitytwin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - identitytwin_private

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      paypal-egress:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-dev-secret-token-change-in-prod}
      DATABASE_URL: postgresql+psycopg://identitytwin_user:identitytwin_pass@db:5432/identitytwin
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_PROVIDER_PRODUCTION_MOCK_OVERRIDE: ${PAYMENT_PROVIDER_PRODUCTION_MOCK_OVERRIDE:-false}
      CANARY_HMAC_SECRET: ${CANARY_HMAC_SECRET:-}
      EVIDENCE_HMAC_KEY: ${EVIDENCE_HMAC_KEY:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-identitytwin-api}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      AI_INVESTIGATION_ENABLED: ${AI_INVESTIGATION_ENABLED:-true}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-false}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_EGRESS_HOST: ${AI_LLM_EGRESS_HOST:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_TIMEOUT: ${AI_LLM_TIMEOUT:-10}
      AI_LLM_MAX_INPUT_CHARS: ${AI_LLM_MAX_INPUT_CHARS:-12000}
      AI_LLM_MAX_RESPONSE_BYTES: ${AI_LLM_MAX_RESPONSE_BYTES:-65536}
      AI_INVESTIGATION_MAX_EVENTS: ${AI_INVESTIGATION_MAX_EVENTS:-100}
      HTTP_PROXY: http://paypal-egress:3128
      HTTPS_PROXY: http://paypal-egress:3128
      NO_PROXY: localhost,127.0.0.1,api,db,paypal-egress,gateway
      HONEY_DB_URL: postgresql+psycopg://honey_rw:identitytwin_honey_pass@db:5432/identitytwin
      LOG_LEVEL: INFO
    networks:
      - identitytwin_private
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  paypal-egress:
    image: ubuntu/squid:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/identitytwin/squid-entrypoint.sh"]
    environment:
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-false}
      AI_LLM_EGRESS_HOST: ${AI_LLM_EGRESS_HOST:-}
    networks:
      - identitytwin_private
      - gateway_egress
    volumes:
      - ./scripts/docker/squid-entrypoint.sh:/opt/identitytwin/squid-entrypoint.sh:ro

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${IDENTITYTWIN_API_PORT:-8001}:8000"
    networks:
      - identitytwin_private
      - gateway_egress
    volumes:
      - ./scripts/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${IDENTITYTWIN_CONSOLE_PORT:-3001}:80"
    networks:
      - identitytwin_private
      - console_ingress

networks:
  identitytwin_private:
    internal: true
  gateway_egress:
    driver: bridge
  console_ingress:
    driver: bridge

volumes:
  postgres_data:
