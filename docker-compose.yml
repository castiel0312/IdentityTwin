services:
  db:
    image: postgres:16-alpine
    container_name: identitytwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: identitytwin_user
      POSTGRES_PASSWORD: identitytwin_pass
      POSTGRES_DB: identitytwin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-honey-role.sql:/docker-entrypoint-initdb.d/01-honey-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identitytwin_user -d identitytwin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - identitytwin_private

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: identitytwin_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      paypal-egress:
        condition: service_started
    environment:
      ENVIRONMENT: development
      ALLOW_DEV_AUTH: "true"
      DEV_AUTH_TOKEN: dev-secret-token-change-in-prod
      DATABASE_URL: postgresql://identitytwin_user:identitytwin_pass@db:5432/identitytwin
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      HTTP_PROXY: http://paypal-egress:3128
      HTTPS_PROXY: http://paypal-egress:3128
      NO_PROXY: localhost,127.0.0.1,api,db,paypal-egress,gateway
      HONEY_DB_URL: postgresql+psycopg://honey_rw:identitytwin_honey_pass@db:5432/identitytwin
      LOG_LEVEL: INFO
    networks:
      - identitytwin_private
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages/contracts:/workspace/packages/contracts

  paypal-egress:
    image: ubuntu/squid:latest
    container_name: identitytwin_paypal_egress
    restart: unless-stopped
    networks:
      - identitytwin_private
      - gateway_egress
    volumes:
      - ./scripts/docker/paypal-squid.conf:/etc/squid/squid.conf:ro

  gateway:
    image: nginx:1.27-alpine
    container_name: identitytwin_gateway
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8000:8000"
    networks:
      - identitytwin_private
      - gateway_egress
    volumes:
      - ./scripts/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  identitytwin_private:
    internal: true
  gateway_egress:
    driver: bridge

volumes:
  postgres_data:
