name: IdentityTwin Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Lint, Test & OpenAPI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api[dev] || pip install "fastapi>=0.100.0" "uvicorn[standard]>=0.23.0" "pydantic>=2.0" "pydantic-settings>=2.0" "sqlalchemy>=2.0.0" "alembic>=1.12.0" "httpx>=0.24.0" "pytest>=7.0.0" "psycopg2-binary>=2.9.0" "ruff>=0.1.0"

      - name: Run Ruff Lint Checks
        run: |
          ruff check apps/api/app apps/api/tests scripts

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check apps/api/app apps/api/tests scripts

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          ALLOW_DEV_AUTH: "true"
          PAYMENT_PROVIDER: mock
        run: |
          cd apps/api && PYTHONPATH=. pytest -v tests/

      - name: Verify OpenAPI Specification Up-to-Date
        run: |
          PYTHONPATH=apps/api python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json || (echo "ERROR: packages/contracts/openapi.json is out of date. Run 'make openapi' and commit changes." && exit 1)
