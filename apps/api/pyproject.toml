[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identitytwin-api"
version = "0.1.0"
description = "IdentityTwin Trust Gateway and Behavioral Security API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IdentityTwin Team", email = "dev@identitytwin.local" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

# Packaging
#
# The API is distributed as a single top-level package ("app"). This
# directory is a flat layout, so setuptools would otherwise auto-discover
# "app" AND "alembic" (the migration directory) as two top-level packages
# and abort the build. Discovery is therefore explicit:
#
#   * include  -> only the application package and its subpackages,
#   * exclude  -> the migration directory and the test suite, which are
#                 development scaffolding and must never be imported as
#                 installed packages ("alembic" in particular would shadow
#                 the real Alembic library used for migrations),
#   * namespaces-> "app" and several of its subpackages intentionally have no
#                 __init__.py, so PEP 420 namespace discovery is required.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "alembic", "alembic.*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP017", "E501", "UP042", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long running calibration replays (deselect with '-m \"not slow\"')",
]
