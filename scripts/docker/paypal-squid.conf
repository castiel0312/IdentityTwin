http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl paypal_sandbox dstdomain api-m.sandbox.paypal.com
acl forbidden_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4

http_access deny !SSL_ports
